# Régénère et publie le tableau de bord sur GitHub Pages.
#
# Déclencheurs : un push qui modifie data/ (nouvel import fournisseur), une exécution
# quotidienne (simulation de l'import quotidien) et un lancement manuel.
# Les actions tierces sont figées sur l'empreinte exacte de leur commit (et non sur une
# étiquette déplaçable) ; la version correspondante est indiquée en commentaire.
name: Tableau de bord

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  schedule:
    # Chaque jour à 05:17 UTC (07:17 à Paris en été, 06:17 en hiver).
    - cron: "17 5 * * *"
  workflow_dispatch:

# Droits minimaux par défaut ; seule la publication reçoit les droits Pages.
permissions:
  contents: read

# Une seule publication à la fois ; une publication en cours n'est jamais interrompue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Tests et génération
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier les outils de test
        # Node (moteur JS) et Chrome (rendu, vie privée, contrastes) sont obligatoires en CI :
        # GitHub définit CI=true, et les tests échouent au lieu d'être ignorés s'ils manquent.
        run: |
          node --version
          google-chrome --version

      - name: Lancer les tests
        run: python -m pytest -q

      - name: Générer le site
        # GITHUB_SHA et GITHUB_REPOSITORY alimentent le numéro de commit du pied de page.
        run: python -m dashboard

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Envoyer le site généré
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Publication sur GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
